<mat-form-field appearance="outline">
    <mat-label>{{ label() }}</mat-label>
    <input matInput [value]="field?.value" (input)="onInput($event)" />
    <button
      type="submit"
      matIconButton
      matSuffix
    >
      <mat-icon fontIcon>edit</mat-icon>
    </button>
    <button
      type="submit"
      matIconButton
      matSuffix
      (click)="onDelete()"
    >
      <mat-icon fontIcon>delete</mat-icon>
    </button>
</mat-form-field>
